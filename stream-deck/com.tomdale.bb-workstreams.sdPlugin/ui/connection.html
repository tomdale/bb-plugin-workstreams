<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BB Workstreams</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="BB server">
      <sdpi-textfield
        setting="serverUrl"
        global
        placeholder="Found automatically"
      ></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Token">
      <sdpi-password
        setting="token"
        global
        placeholder="Found automatically"
      ></sdpi-password>
    </sdpi-item>
  </body>
</html>
