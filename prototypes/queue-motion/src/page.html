<!doctype html>

<aside class="inspector" id="inspector" aria-label="Inspector">
  <header class="ins-head">
    <div class="ins-title">
      <h2>Queue motion lab</h2>
      <button type="button" class="copy" data-help="copy" data-act="copy">
        Copy settings
      </button>
    </div>
    <p>
      Hold <kbd>↑</kbd> or <kbd>↓</kbd> (or <kbd>J</kbd>/<kbd>K</kbd>), with the
      OS key repeat. Hover a control, or Tab to it, for its help.
    </p>
  </header>
  <div id="modules"></div>
</aside>
<main class="stage-area" id="stage-area">
  <div class="page" id="page">
    <div class="col" id="col">
      <div id="glide" style="transform: translateY(0)">
        <div id="head"></div>
        <div class="clip" id="clip">
          <div class="stage" id="stage">
            <svg
              class="bezier"
              id="bezier"
              viewBox="0 0 680 600"
              aria-hidden="true"
              hidden
            ></svg>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="cover"></div>
  <div class="foot"><span id="pos"></span></div>
</main>
